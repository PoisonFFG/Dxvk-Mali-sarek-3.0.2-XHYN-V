name: Build DXVK-Sarek 3.0.2 for XHYN V

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Android NDK r27c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Unpack kit (xhyn-dxvk-build.zip)
        run: |
          unzip -q xhyn-dxvk-build.zip -d kit
          ls kit/xhyn-dxvk-build

      - name: Build
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
          VARIANT: ${{ matrix.variant }}
        run: bash kit/xhyn-dxvk-build/build.sh

      - name: Show errors (if build failed)
        if: failure()
        run: grep -nE "error:|FAILED|ERROR:|fatal|FAIL" build.log configure.log || true

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: dxvk-sarek-3.0.2-mali-xhyn-sc${{ matrix.variant }}
          path: dxvk-sarek-3.0.2-mali-xhyn-sc${{ matrix.variant }}.zip

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-sc${{ matrix.variant }}
          path: |
            configure.log
            build.log
          if-no-files-found: ignore
